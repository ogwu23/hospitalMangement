<div class="filters" style="display: flex; gap: 1rem; margin-bottom: 1rem;">
    <mat-form-field appearance="fill">
      <mat-label>Search by name</mat-label>
      <input matInput [(ngModel)]="searchTerm" (input)="applyFilters()" />
    </mat-form-field>
  
    <mat-form-field appearance="fill">
      <mat-label>Specialization</mat-label>
      <mat-select [(ngModel)]="specializationFilter" (selectionChange)="applyFilters()">
        <mat-option value="">All</mat-option>
        <mat-option *ngFor="let spec of specializations" [value]="spec">{{ spec }}</mat-option>
      </mat-select>
    </mat-form-field>
  
    <button mat-button color="primary" (click)="clearFilters()">Clear</button>
    <button mat-raised-button color="accent" (click)="createDoctor()">+ Add Doctor</button>
  </div>
  
  <table mat-table [dataSource]="filteredDoctors" class="mat-elevation-z2" style="width: 100%;">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Name </th>
      <td mat-cell *matCellDef="let doctor"> {{ doctor.name }} </td>
    </ng-container>
  
    <ng-container matColumnDef="specialization">
      <th mat-header-cell *matHeaderCellDef> Specialization </th>
      <td mat-cell *matCellDef="let doctor"> {{ doctor.specialization }} </td>
    </ng-container>
  
    <ng-container matColumnDef="contact">
      <th mat-header-cell *matHeaderCellDef> Contact </th>
      <td mat-cell *matCellDef="let doctor">
        📞 {{ doctor.contactNumber }} <br />
        📧 {{ doctor.email }}
      </td>
    </ng-container>
  
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Actions </th>
      <td mat-cell *matCellDef="let doctor">
        <button mat-icon-button color="primary" (click)="editDoctor(doctor.id)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="deleteDoctor(doctor.id)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>
  
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
